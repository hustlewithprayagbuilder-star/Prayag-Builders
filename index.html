<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prayag Builders | Construction & Development</title>

  <meta name="description"
        content="Prayag Builders - Professional construction, modern buildings, renovation and property development services in Prayagraj.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f7f7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      width: 100%;
      display: block;
    }

    /* NAVBAR */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 7%;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #d9a441;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a:hover {
      color: #d9a441;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      background:
        linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.62)),
        url("https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      display: flex;
      align-items: center;
      padding: 70px 7%;
      color: white;
    }

    .hero-content {
      max-width: 720px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #d9a441;
    }

    .hero p {
      font-size: 19px;
      margin-bottom: 30px;
      color: #eee;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      margin-right: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      font-weight: bold;
      transition: .3s;
    }

    .btn-primary {
      background: #d9a441;
      color: #111;
    }

    .btn-primary:hover {
      background: white;
    }

    .btn-outline {
      border: 1px solid white;
      color: white;
    }

    .btn-outline:hover {
      background: white;
      color: #111;
    }

    /* SECTIONS */
    section {
      padding: 80px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #666;
    }

    /* ABOUT */
    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
      background: white;
    }

    .about img {
      height: 450px;
      object-fit: cover;
      border-radius: 8px;
    }

    .about-text h2 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .about-text p {
      color: #555;
      margin-bottom: 18px;
    }

    /* SERVICES */
    .services {
      background: #f3f3f3;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      transition: .3s;
    }

    .card:hover {
      transform: translateY(-7px);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .card p {
      color: #666;
    }

    /* PROJECTS */
    .projects {
      background: white;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .project {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      height: 350px;
      background: #ddd;
    }

    .project img {
      height: 100%;
      object-fit: cover;
      transition: .5s;
    }

    .project:hover img {
      transform: scale(1.08);
    }

    .project-info {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 25px;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,.9));
    }

    .project-info h3 {
      font-size: 23px;
    }

    /* WHY US */
    .why {
      background: #111;
      color: white;
    }

    .why .section-title p {
      color: #bbb;
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      text-align: center;
    }

    .why-box {
      padding: 25px;
    }

    .why-box strong {
      display: block;
      font-size: 40px;
      color: #d9a441;
      margin-bottom: 5px;
    }

    /* PROCESS */
    .process {
      background: #f3f3f3;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .step {
      text-align: center;
      background: white;
      padding: 30px 20px;
      border-radius: 8px;
    }

    .step-number {
      width: 55px;
      height: 55px;
      margin: auto auto 15px;
      border-radius: 50%;
      background: #d9a441;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    /* QUOTE */
    .quote {
      background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.72)),
        url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    .quote-container {
      max-width: 700px;
      margin: auto;
    }

    .quote form {
      display: grid;
      gap: 15px;
    }

    .quote input,
    .quote textarea,
    .quote select {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .quote textarea {
      height: 130px;
      resize: vertical;
    }

    /* CONTACT */
    .contact {
      background: white;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      text-align: center;
    }

    .contact-box {
      padding: 30px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .contact-box h3 {
      margin-bottom: 10px;
    }

    .contact-box p {
      color: #555;
    }

    /* FOOTER */
    footer {
      background: #0b0b0b;
      color: white;
      text-align: center;
      padding: 30px 7%;
    }

    footer span {
      color: #d9a441;
    }

    /* MOBILE */
    @media (max-width: 800px) {

      .nav-links {
        display: none;
      }

      .hero {
        min-height: 80vh;
        padding: 60px 6%;
      }

      section {
        padding: 60px 6%;
      }

      .about {
        grid-template-columns: 1fr;
      }

      .about img {
        height: 300px;
      }

      .cards,
      .project-grid {
        grid-template-columns: 1fr;
      }

      .why-grid,
      .process-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
